<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title data-i18n="controlTitle">Araneae · Control Panel</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="desktop.css">
</head>
<body class="desktop-controls">
  <div class="desktop-heading">
    <img class="desktop-mark" src="araneae-mark.svg" alt="" aria-hidden="true">
    <div><h1>Araneae</h1><p class="eyebrow">Araneae / DESKTOP COMPANION</p></div>
  </div>
  <section class="controls" aria-label="Desktop companion controls" data-i18n-label="controlsLabel">
    <fieldset id="settings" disabled>
      <div class="panel-head"><span data-i18n="behavior">Behavior</span><span class="serial">Araneae</span></div>
      <div class="modes" role="group" aria-label="Behavior modes" data-i18n-label="modesLabel">
        <button data-mode="roam" data-i18n="roam" aria-pressed="true" class="selected">Patrol</button>
        <button data-mode="follow" data-i18n="follow" aria-pressed="false">Follow Pointer</button>
        <button data-mode="observe" data-i18n="observe" aria-pressed="false">Observe</button>
      </div>
      <label class="range-row" for="speed"><span data-i18n="speed">Speed</span><input id="speed" type="range" min="0.35" max="3" step="0.05" value="1.25"><output id="speedValue" for="speed">1.25×</output></label>
      <label class="range-row" for="size"><span data-i18n="size">Size</span><input id="size" type="range" min="0.35" max="2.1" step="0.05" value="0.5"><output id="sizeValue" for="size">0.50×</output></label>
      <button id="allowCrossScreen" class="toggle cross-screen-toggle" aria-pressed="true"><span class="switch" aria-hidden="true"></span><span data-i18n="allowCrossScreen">Allow Cross-Display Movement</span></button>
      <div class="panel-bottom">
        <button id="paused" class="text-button">Pause Ⅱ</button>
        <button id="visible">Hide Spider</button>
      </div>
    </fieldset>
  </section>
  <p class="desktop-note"><span data-i18n="noteBefore">Hold </span><strong data-i18n="command">⌘ Command + click</strong><span data-i18n="noteAfter"> to dash to a destination. When cross-display movement is off, clicks, patrol and following stay on the spider’s current display. Commands are ignored while paused or hidden.</span></p>
  <p id="status" class="desktop-status" role="status" data-i18n="connecting">Connecting to the companion…</p>
  <script type="module" src="controls.js"></script>
</body>
</html>
